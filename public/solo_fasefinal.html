<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fase Final - Mundial 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:12px}
.banner{background:linear-gradient(90deg,#fff4e6,#ffe9f0);color:#b3402a;padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.muted{color:#86868b;font-size:12px;margin-bottom:10px}
.flag{border-radius:3px;object-fit:cover;vertical-align:middle;box-shadow:0 0 1px rgba(0,0,0,.3)}
.flag-ph{display:inline-flex;align-items:center;justify-content:center;background:#e5e5ea;border-radius:3px;font-size:8px;font-weight:700;color:#8e8e93}
.bwrap{overflow-x:auto;padding-bottom:16px}
.bracket{display:flex;gap:10px;align-items:stretch;min-width:1400px}
.col{display:flex;flex-direction:column;justify-content:space-around;min-width:140px;flex:1}
.col.center{min-width:180px;flex:1.3}
.ctitle{font-size:10px;font-weight:800;color:#86868b;text-transform:uppercase;letter-spacing:.4px;text-align:center;margin-bottom:8px}
.match{background:#fff;border-radius:9px;padding:7px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:5px 0}
.match.locked{background:#f2f2f7}
.match.final-m{background:linear-gradient(135deg,#fff8e6,#fff);border:2px solid #ffd60a}
.mdate{font-size:9px;color:#aeaeb2;margin-bottom:4px;display:flex;justify-content:space-between}
.team{display:flex;align-items:center;gap:5px;padding:2px 0}
.tname{flex:1;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.tbd{color:#c7c7cc;font-style:italic;font-weight:500}
.tname.win{color:#34c759;font-weight:800}
.sc{width:30px;height:26px;border:1.4px solid #d2d2d7;border-radius:6px;text-align:center;font-size:13px;font-weight:700;flex-shrink:0}
.sc:disabled{background:#e9e9eb;color:#8e8e93}
.sc:focus{outline:none;border-color:#0071e3}
.adv{margin-top:4px;width:100%;padding:3px;border:1px solid #d2d2d7;border-radius:6px;font-size:10.5px;font-weight:600;color:#0071e3}
.mpts{margin-top:5px;text-align:center;font-size:11px;font-weight:800;padding:2px 0;border-radius:6px}
.mpts.pos{background:#e8f9ee;color:#1a7a38}
.mpts.zero{background:#f2f2f7;color:#8e8e93}
.champ{text-align:center;font-size:11px;color:#86868b;margin-top:8px}
.champ b{color:#1d1d1f;font-size:13px}
.podium{background:#fff;border-radius:9px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:10px;font-size:11px}
.podium .row{display:flex;align-items:center;gap:6px;padding:3px 0}
.podium .pos{font-weight:800;width:16px}
</style></head><body>
<div class="banner">🏆 FASE FINAL — Equipos reales del Mundial 2026. Predice los marcadores desde 16avos hasta la gran final. ¡Editable!</div>
<div class="muted" id="cnt"></div>
<div class="bwrap"><div class="bracket" id="bracket"></div></div>
<script>
const FLAGS={"México": "mx", "Sudáfrica": "za", "Rep. de Corea": "kr", "Rep. Checa": "cz", "Canadá": "ca", "Bosnia": "ba", "Catar": "qa", "Suiza": "ch", "Brasil": "br", "Marruecos": "ma", "Haití": "ht", "Escocia": "gb-sct", "EE. UU.": "us", "Paraguay": "py", "Australia": "au", "Turquía": "tr", "Alemania": "de", "Curazao": "cw", "Costa de Marfil": "ci", "Ecuador": "ec", "Países Bajos": "nl", "Japón": "jp", "Suecia": "se", "Túnez": "tn", "Bélgica": "be", "Egipto": "eg", "RI de Irán": "ir", "Nueva Zelanda": "nz", "España": "es", "Islas de Cabo Verde": "cv", "Arabia Saudí": "sa", "Uruguay": "uy", "Francia": "fr", "Senegal": "sn", "Irak": "iq", "Noruega": "no", "Argentina": "ar", "Argelia": "dz", "Austria": "at", "Jordania": "jo", "Portugal": "pt", "RD Congo": "cd", "Uzbekistán": "uz", "Colombia": "co", "Inglaterra": "gb-eng", "Croacia": "hr", "Ghana": "gh", "Panamá": "pa"}, R32={"M73": ["L", "dom 28 jun", "Canadá", "Sudáfrica"], "M74": ["L", "lun 29 jun", "Alemania", "Paraguay"], "M77": ["L", "mar 30 jun", "Francia", "Suecia"], "M75": ["L", "lun 29 jun", "Países Bajos", "Marruecos"], "M83": ["L", "jue 2 jul", "Portugal", "Croacia"], "M84": ["L", "jue 2 jul", "España", "Austria"], "M81": ["L", "mié 1 jul", "EE. UU.", "Bosnia"], "M82": ["L", "mié 1 jul", "Bélgica", "Senegal"], "M76": ["R", "lun 29 jun", "Brasil", "Japón"], "M78": ["R", "mar 30 jun", "Costa de Marfil", "Noruega"], "M79": ["R", "mar 30 jun", "México", "Ecuador"], "M80": ["R", "mié 1 jul", "Inglaterra", "RD Congo"], "M86": ["R", "vie 3 jul", "Argentina", "Islas de Cabo Verde"], "M88": ["R", "vie 3 jul", "Australia", "Egipto"], "M85": ["R", "jue 2 jul", "Suiza", "Argelia"], "M87": ["R", "vie 3 jul", "Colombia", "Ghana"]}, KO={"M89": ["L", "sáb 4 jul", "WM74", "WM77"], "M90": ["L", "sáb 4 jul", "WM73", "WM75"], "M93": ["L", "lun 6 jul", "WM83", "WM84"], "M94": ["L", "lun 6 jul", "WM81", "WM82"], "M91": ["R", "dom 5 jul", "WM76", "WM78"], "M92": ["R", "dom 5 jul", "WM79", "WM80"], "M95": ["R", "mar 7 jul", "WM86", "WM88"], "M96": ["R", "mar 7 jul", "WM85", "WM87"], "M97": ["L", "jue 9 jul", "WM89", "WM90"], "M98": ["L", "vie 10 jul", "WM93", "WM94"], "M99": ["R", "sáb 11 jul", "WM91", "WM92"], "M100": ["R", "sáb 11 jul", "WM95", "WM96"], "M101": ["L", "mar 14 jul", "WM97", "WM98"], "M102": ["R", "mié 15 jul", "WM99", "WM100"], "M103": ["C", "sáb 18 jul", "LM101", "LM102"], "M104": ["C", "dom 19 jul", "WM101", "WM102"]}, ORDER_L={"r32": ["M74", "M77", "M73", "M75", "M83", "M84", "M81", "M82"], "r16": ["M89", "M90", "M93", "M94"], "qf": ["M97", "M98"], "sf": ["M101"]}, ORDER_R={"r32": ["M76", "M78", "M79", "M80", "M86", "M88", "M85", "M87"], "r16": ["M91", "M92", "M95", "M96"], "qf": ["M99", "M100"], "sf": ["M102"]};
let PLAYED_LOCKED=['M73','M76'];  // por defecto; se actualiza desde el INIT (tabla match_locks)
let QID=null,USERNAME='Usuario',READONLY=false;
let REAL={};        // resultados reales {mid:{h,a,w}} (solo en modo lectura/puntos)
let SHOW_PTS=false; // mostrar puntos por partido

// Puntos de un partido: pick del usuario vs resultado real, comparando posición.
function puntosDe(mid){
  if(!SHOW_PTS) return null;
  const real=REAL[mid]; const pk=PICKS[mid];
  if(!real||real.h==null||real.a==null) return null;  // sin resultado real, no se puntúa
  if(!pk||pk.h==null||pk.a==null) return 0;
  const pickT=teamsOf(mid), realT=realTeamsOf(mid);
  let pts=0;
  const localCoincide = pickT.h && realT.h && pickT.h===realT.h;
  const visitCoincide = pickT.a && realT.a && pickT.a===realT.a;
  const golLocalOk = localCoincide && pk.h===real.h;
  const golVisitOk = visitCoincide && pk.a===real.a;
  if(golLocalOk) pts+=1;
  if(golVisitOk) pts+=1;
  const ganadorOk = pk.w && real.w && pk.w===real.w && pk.w!=='Sin definir';
  if(ganadorOk) pts+=2;
  if(golLocalOk && golVisitOk && ganadorOk) pts+=1;
  return pts;
}
// Equipos en cada posición según los RESULTADOS REALES (propaga con REAL)
function realTeamsOf(mid){
  if(R32[mid])return{h:R32[mid][2],a:R32[mid][3]};
  const k=KO[mid]; if(!k)return{h:null,a:null};
  return{h:realResolve(k[2]),a:realResolve(k[3])};
}
function realResolve(slot){const m=/^([WL])M(\d+)$/.exec(slot);if(!m)return null;
  const kind=m[1],src='M'+m[2],pk=REAL[src];if(!pk||pk.w==null)return null;
  if(pk.w==='Sin definir')return 'Sin definir';
  const t=realTeamsOf(src);if(kind==='W')return pk.w;
  if(pk.w===t.h)return t.a;if(pk.w===t.a)return t.h;return null;}
const PICKS={};

function fh(n,w=18){const c=FLAGS[n],h=Math.round(w*.67);
  if(!n)return `<div class="flag-ph" style="width:${w}px;height:${h}px">?</div>`;
  if(!c)return `<div class="flag-ph" style="width:${w}px;height:${h}px">${n.slice(0,2)}</div>`;
  return `<img src="https://flagcdn.com/w40/${c}.png" class="flag" style="width:${w}px;height:${h}px" alt="${n}">`;}

function teamsOf(mid){
  if(R32[mid])return{h:R32[mid][2],a:R32[mid][3]};
  const k=KO[mid]; if(!k)return{h:null,a:null};
  return{h:resolve(k[2]),a:resolve(k[3])};}
function resolve(slot){const m=/^([WL])M(\d+)$/.exec(slot);if(!m)return null;
  const kind=m[1],src='M'+m[2],pk=PICKS[src];if(!pk||pk.w==null)return null;
  // Si el ganador quedó "Sin definir" (0-0 sin elegir), avanza "Sin definir"
  if(pk.w==='Sin definir')return 'Sin definir';
  const t=teamsOf(src);if(kind==='W')return pk.w;
  if(pk.w===t.h)return t.a;if(pk.w===t.a)return t.h;return null;}
function validWinner(mid){const pk=PICKS[mid];if(!pk)return null;const t=teamsOf(mid);
  if(pk.w==='Sin definir')return 'Sin definir';
  return(pk.w&&(pk.w===t.h||pk.w===t.a))?pk.w:null;}
function isLocked(mid){return READONLY||PLAYED_LOCKED.includes(mid);}
function dateOf(mid){return (R32[mid]?R32[mid][1]:(KO[mid]?KO[mid][1]:''));}

function setScore(mid,side,val){if(isLocked(mid))return;
  const pk=PICKS[mid]||(PICKS[mid]={h:null,a:null,w:null});
  pk[side]=val===''?null:Math.max(0,parseInt(val)||0);
  if(pk.h!=null&&pk.a!=null){const t=teamsOf(mid);
    if(pk.h>pk.a)pk.w=t.h;else if(pk.a>pk.h)pk.w=t.a;
    else pk.w=pk.w&&(pk.w===t.h||pk.w===t.a)?pk.w:null;} // empate: conservar elección si válida
  else pk.w=null; // si falta algún marcador, limpiar ganador (evita orden pegado al borrar)
  save(mid);
  // NO redibujar todo (en móvil borra lo que se escribe). Solo refrescar las
  // llaves siguientes y el contador, sin tocar los inputs que el usuario usa.
  refreshDependents();}
function setAdv(mid,team){if(isLocked(mid))return;
  const pk=PICKS[mid]||(PICKS[mid]={h:null,a:null,w:null});pk.w=team||null;save(mid);refreshDependents();}
function refreshDependents(){
  // Redibujar el cuadro completo SIN romper el foco: solo si el elemento activo
  // no es un input de marcador. Si el usuario está escribiendo, se pospone.
  const ae=document.activeElement;
  if(ae&&ae.classList&&ae.classList.contains('sc')){
    // El usuario está en un input: NO redibujar ahora (evita borrado en móvil).
    // Los equipos que avanzan se actualizarán cuando salga del campo (blur/cambio siguiente).
    updateCounter();
    return;
  }
  render();
}
function updateCounter(){
  const done=Object.entries(PICKS).filter(([mid,p])=>{
    const mm=/^M(\d+)$/.exec(mid); if(!mm) return false;
    const n=+mm[1]; return n>=73&&n<=88&&p&&p.h!=null&&p.a!=null;
  }).length;
  const el=document.getElementById('cnt');
  if(el) el.textContent=`${done} de 16 partidos pronosticados (16avos)`;
}
function onLeaveInput(){
  // Al salir de un input, redibujar para mostrar los equipos que avanzan.
  // Se espera un instante para no chocar con el cambio de foco a otro input.
  setTimeout(()=>{
    const ae=document.activeElement;
    if(ae&&ae.classList&&ae.classList.contains('sc'))return; // sigue en otro input
    render();
  },150);
}
function save(mid){const pk=PICKS[mid]||{};
  parent.postMessage({type:'SAVE_PICK',quinielaId:QID,matchId:mid,
    pick:{h:pk.h??null,a:pk.a??null,w:pk.w??null}},'*');}

function matchCard(mid,isFinal){
  const t=teamsOf(mid),pk=PICKS[mid]||{h:null,a:null,w:null},locked=isLocked(mid);
  const played=PLAYED_LOCKED.includes(mid);
  const w=validWinner(mid);
  const nm=(n)=>n?`${fh(n)} <span class="tname${w===n?' win':''}">${n}</span>`:`<span class="tname tbd">Por definir</span>`;
  // Editable si AMBOS lados tienen algún equipo (real o "Sin definir").
  // Solo se bloquea cuando un lado aún es null (el partido previo no tiene ganador).
  const canEdit = !locked && t.h && t.a;
  const sc=(s)=>`<input class="sc" type="number" min="0" inputmode="numeric" value="${pk[s]??''}" ${canEdit?'':'disabled'} onchange="setScore('${mid}','${s}',this.value)" onblur="onLeaveInput()">`;
  let adv='';
  if(t.h&&t.a&&pk.h!=null&&pk.a!=null&&pk.h===pk.a){
    // En empate, el menú "¿Quién avanza?" solo ofrece equipos reales (no "Sin definir")
    const opts=[t.h,t.a].filter(x=>x&&x!=='Sin definir');
    adv=`<select class="adv" ${locked?'disabled':''} onchange="setAdv('${mid}',this.value)">
      <option value="">🏆 ¿Quién avanza?</option>
      ${opts.map(x=>`<option value="${x}" ${pk.w===x?'selected':''}>${x}</option>`).join('')}</select>`;}
  // Pastilla de puntos (solo en modo lectura con resultados reales)
  const pts=puntosDe(mid);
  const ptsHtml = (pts!=null) ? `<div class="mpts ${pts>0?'pos':'zero'}">${pts} pts</div>` : '';
  return `<div class="match${locked?' locked':''}${isFinal?' final-m':''}">
    <div class="mdate"><span>${dateOf(mid)} · ${mid}</span>${played?'🔒':''}</div>
    <div class="team">${nm(t.h)} ${sc('h')}</div>
    <div class="team">${nm(t.a)} ${sc('a')}</div>${adv}${ptsHtml}</div>`;}

function col(title,mids){return `<div class="col"><div class="ctitle">${title}</div>
  ${mids.map(m=>matchCard(m,false)).join('')}</div>`;}

function centerCol(){
  const champ=validWinner('M104');
  const t4=teamsOf('M104'),t3=teamsOf('M103');
  // 1ro=ganador final, 2do=perdedor final, 3ro=ganador 3er, 4to=perdedor 3er
  let p1=champ,p2=null,p3=validWinner('M103'),p4=null;
  if(champ){p2=(champ===t4.h?t4.a:t4.h);}
  if(p3){p4=(p3===t3.h?t3.a:t3.h);}
  // Orden real (para comparar y puntuar): campeón/sub de REAL M104, 3ro/4to de REAL M103
  const rw=(mid)=>{const p=REAL[mid];if(!p||p.w==null||p.w==='Sin definir')return null;const t=realTeamsOf(mid);return(p.w===t.h||p.w===t.a)?p.w:null;};
  const rc=rw('M104'), r3=rw('M103');
  const rt4=realTeamsOf('M104'), rt3=realTeamsOf('M103');
  const rCampeon=rc, rSub=rc?(rc===rt4.h?rt4.a:rt4.h):null;
  const rTercero=r3, rCuarto=r3?(r3===rt3.h?rt3.a:rt3.h):null;
  const ptsPos=(team,realTeam,val)=>(SHOW_PTS&&team&&realTeam&&team===realTeam)?val:(SHOW_PTS?0:null);
  const pill=(p)=>p==null?'':`<span class="mpts ${p>0?'pos':'zero'}" style="margin-left:8px">${p} pts</span>`;
  const row=(pos,team,medal,pv)=>`<div class="row"><span class="pos">${medal}</span>${team?fh(team,16)+' <b>'+team+'</b>':'<span class="tname tbd">—</span>'}${pill(pv)}</div>`;
  return `<div class="col center"><div class="ctitle">🏆 Final</div>
    ${matchCard('M104',true)}
    <div class="champ">${champ?'Campeón: <b>'+champ+'</b>':'El campeón se define con la final'}</div>
    <div class="ctitle" style="margin-top:14px">3er Puesto</div>
    ${matchCard('M103',false)}
    <div class="podium">
      <div class="ctitle" style="text-align:left;margin-bottom:6px">Posiciones finales</div>
      ${row(1,p1,'🥇',ptsPos(p1,rCampeon,20))}${row(2,p2,'🥈',ptsPos(p2,rSub,10))}${row(3,p3,'🥉',ptsPos(p3,rTercero,5))}${row(4,p4,'4º',ptsPos(p4,rCuarto,3))}
    </div></div>`;}

function render(){
  const done=Object.entries(PICKS).filter(([mid,p])=>{
    const mm=/^M(\d+)$/.exec(mid); if(!mm) return false;
    const n=+mm[1]; return n>=73&&n<=88&&p&&p.h!=null&&p.a!=null;
  }).length;
  document.getElementById('cnt').textContent=`${done} de 16 partidos pronosticados (16avos)`;
  document.getElementById('bracket').innerHTML=
    col('16avos',ORDER_L.r32)+col('Octavos',ORDER_L.r16)+col('Cuartos',ORDER_L.qf)+col('Semis',ORDER_L.sf)
    +centerCol()
    +col('Semis',ORDER_R.sf)+col('Cuartos',ORDER_R.qf)+col('Octavos',ORDER_R.r16)+col('16avos',ORDER_R.r32);
}

window.addEventListener('message',(e)=>{const d=e.data||{};
  if(d.type==='INIT'){QID=d.data?.quinielaId||null;USERNAME=d.data?.username||'Usuario';READONLY=d.data?.readOnly||false;
    if(Array.isArray(d.data?.lockedMatches)) PLAYED_LOCKED=d.data.lockedMatches;
    // Resultados reales para calcular puntos (solo si vienen)
    if(d.data?.realResults && typeof d.data.realResults==='object'){
      REAL=d.data.realResults; SHOW_PTS=true;
    }
    const picks=d.data?.picks||{};
    // Cargar solo partidos de la fase final (M73-M104)
    for(const[mid,pk]of Object.entries(picks)){
      const mm=/^M(\d+)$/.exec(mid); if(!mm) continue;
      const n=+mm[1]; if(n<73||n>104) continue;
      const h=pk.h??pk.goals_home??null;
      const a=pk.a??pk.goals_away??null;
      let w=pk.w??pk.winner??null;
      PICKS[mid]={h,a,w};
    }
    // Inferir ganador donde haya marcador no-empate pero falte winner
    for(const mid of Object.keys(PICKS)){
      const pk=PICKS[mid];
      if(pk.h!=null&&pk.a!=null&&(pk.w==null||pk.w==='')){
        const t=teamsOf(mid);
        if(pk.h>pk.a)pk.w=t.h; else if(pk.a>pk.h)pk.w=t.a;
      }
    }
    render();}});
parent.postMessage({type:'IFRAME_READY'},'*');
render();
</script></body></html>
